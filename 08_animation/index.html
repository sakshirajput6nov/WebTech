<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            
        }
        .box1{
            height:200px;
            width:200px;
            border:1px solid black;
            background-color: lightgrey;
            animation-name: boxslide1;
            /* to create animation must use two name and duration */
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-delay: 2s;
            position:absolute;
        }
        .box2{
            height:200px;
            width:200px;
            border:1px solid rgb(30, 154, 46);
            background-color: rgba(69, 119, 13, 0.399);
            position:absolute;
            animation-name: boxslide2;
            animation-duration: 10s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            /* speed constant */

        }
        
         @keyframes boxslide2{
            0%{
                top:0;
                left:0;
            }
            25%{
                top:0;
                left:calc(100% - 200px);
            }
            50%{
                top:calc(100% - 200px);
                left:calc(100% - 200px);
            }
            75%{
                top:calc(100% - 200px);
                left:0;
            }
            100%{
                top:0;
                left:0;
            }

         }
        @keyframes boxslide1 {
            from {
                /* margin-left:0; */
                top:0;
                left:0;
            }
            to{
                /* margin-left:500px; */
                top:0;
                left: calc(100% - 200px);
            }
        }

    </style>
</head>
<body>
    <!-- @keyframes create animation  -->
    <!-- <div class="box1">

    </div> -->
    <div class="box2">

    </div>
    <div class="circle">

    </div>
</body>
</html>
