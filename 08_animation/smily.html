<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smily</title>
    <!-- <link type="stylesheet" src="smily.css"> -->
     <style>
        *{
    margin: 0px;
    padding:0px;
    background-color: bisque;
}
.face{
    height:500px;
    width:500px;
    margin: 50px auto;
    
    /* background-color: yellow; */
    /* border-radius: 50%; */
    justify-content: space-evenly;
    flex-direction: column;
    border-radius: 50%;

}
.eye-container{
    border:2px rgb(194, 16, 16) solid;
    display:flex;
    justify-content: center;
    border-radius: 50%;
}
.eye{
    height:150px;
    width:150px;
    border:2px rgb(194, 16, 16) solid;
    background-color: white;
    border-radius: 50%;
}
.eyeball{
    height:80px;
    width:80px;
    background-color:rgb(194, 16, 16) ;
    border-radius: 50%;
}
.mouth-container{
    border: 2px solid rgb(194, 16, 16);
    
}
.mouth{
    height:200px;
    width:150px;
    margin:0 auto;
    background-color: rgb(194, 16, 16);
    border-radius: 0 0 50% 50%;
}

     </style>
</head>
<body>
    <article class="face">
        <section class="eye-container">
            <div class="eye">
                <div class="eyeball">

                </div>
            </div>
            <div class="eye">
                <div class="eyeball">
                    
                </div>
            </div>
        </section>
        <section class="mouth-container">
            <div class="mouth"></div>
        </section>

    </article>
</body>
</html>
