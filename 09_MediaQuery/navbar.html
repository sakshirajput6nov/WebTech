<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav bar</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;           
        }
        .navbar{
            height:70%;
            width:100%;
            background-color: blueviolet;
            color:black;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding :0 100px;
        }
        a{
            color:inherit;
            text-decoration: none;
        }
        .navbar>.logo{
            font-weight: bolder;
            font-size: 18px;
        }
        .navbar > .navlinks{
            display:flex;
            align-items: center;
            gap:20px;
            font-weight: 700;
        }
        .hamburger{
            transform:rotate(90deg);
            display:none;
        }
        
        @media (max-width:425px){
            .hamburger{
                display:block;
            }
            .navlinks>.a{
                display:none;
            }
            .navbar{
                padding:0 50px;
            }
        }
        .container{
            width:100%;
            padding:50px 100px;
            display: grid ;
            grid-template-columns: repeat(4,1fr);
            justify-items: center;
            gap:50px 0;
            
        }

        .card{
            height:300px;
            width:200px;
            border:1px solid black;
        }
        @media (max-width:768px){
            .container{
                grid-template-columns: repeat(3,1fr);
                padding:50px;
            }
        }
        @media(max-width:425px){
            .container{
                grid-template-columns: repeat(1,1fr);
                padding:10px;
            }
        }
    </style>
    <!-- <link rel="stylesheet" href="navBar.css"> -->
</head>
<body>
    <header class="navbar">
        <figure class="logo" >Logo</figure>
        <nav class="navlinks">
            <a href="#" >Home</a>
            <a href="#" >Login</a>
            <a href="#">SignUp</a>
            <div class="hamburger">|||</div>
        </nav>
    </header>
    <main class="container">
        <article class="card"></article>
        <article class="card"></article>
        <article class="card"></article>
        <article class="card"></article>
        <article class="card"></article>
    </main>
</body>
</html>
