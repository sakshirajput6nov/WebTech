<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style >
        #head{
            background-color: brown;
        }
        .cl{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>learn </h1>
    <!-- 
    there are 5 types in simple selectors -
    1. id: used to target unique elemnt symbol (#)
    2. class: used to target multiple similar or diff elements (.)
    3. element : used to target multiple similar elemnt(tagname)
    4.group : used to group multiple element (,)
    5. universal :used to target all elements in webpage (*)
    -->
    <h1 id=head>style name using id </h1>
    <h2 class="cl text-red">my cl class h2</h2>
    <h3 class="cl">my cl class h3</h3>
    
</body>
</html>
